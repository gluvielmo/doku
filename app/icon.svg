<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f3a28"/>
      <stop offset="1" stop-color="#24180f"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#efe1cd"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b468"/>
      <stop offset="1" stop-color="#c47f34"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Bevelled keys: a darker slab under each face, like the number pad. -->
  <g fill="#b89b78">
    <rect x="66" y="76" width="112" height="112" rx="28"/>
    <rect x="200" y="76" width="112" height="112" rx="28"/>
    <rect x="334" y="76" width="112" height="112" rx="28"/>
    <rect x="66" y="210" width="112" height="112" rx="28"/>
    <rect x="334" y="210" width="112" height="112" rx="28"/>
    <rect x="66" y="344" width="112" height="112" rx="28"/>
    <rect x="200" y="344" width="112" height="112" rx="28"/>
    <rect x="334" y="344" width="112" height="112" rx="28"/>
  </g>
  <g fill="url(#key)">
    <rect x="66" y="66" width="112" height="112" rx="28"/>
    <rect x="200" y="66" width="112" height="112" rx="28"/>
    <rect x="334" y="66" width="112" height="112" rx="28"/>
    <rect x="66" y="200" width="112" height="112" rx="28"/>
    <rect x="334" y="200" width="112" height="112" rx="28"/>
    <rect x="66" y="334" width="112" height="112" rx="28"/>
    <rect x="200" y="334" width="112" height="112" rx="28"/>
    <rect x="334" y="334" width="112" height="112" rx="28"/>
  </g>

  <!-- The centre key is pressed: lit, sunk, and lifted off its slab a little less. -->
  <rect x="200" y="214" width="112" height="112" rx="28" fill="#8a5a2b"/>
  <rect x="200" y="206" width="112" height="112" rx="28" fill="url(#hot)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="256" y="290" font-size="84" font-weight="800" fill="#fffaf3">9</text>
    <text x="390" y="153" font-size="76" font-weight="700" fill="#3a2a1c">4</text>
    <text x="122" y="421" font-size="76" font-weight="500" fill="#8a5a2b">7</text>
    <!-- Pencil marks: corner notes in brown, centre notes in blue. -->
    <g font-size="30" font-weight="600" fill="#8a7260">
      <text x="92" y="104">1</text>
      <text x="152" y="104">3</text>
      <text x="92" y="166">6</text>
    </g>
    <text x="256" y="402" font-size="34" font-weight="600" fill="#3f6c9e">25</text>
  </g>
</svg>
